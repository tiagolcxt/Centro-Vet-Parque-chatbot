name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes unitários e de integração)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Integração com MySQL real via Testcontainers (o Docker já vem no runner).
      # Os testes @Tag("ai"), que chamam a OpenAI, ficam fora: rodam só com ./gradlew aiTest.
      - name: Testes
        run: ./gradlew test --no-daemon

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: build/reports/tests/test

  web:
    name: Aplicação web (typecheck, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
