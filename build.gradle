plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.clinicavet'
version = '0.1.0-SNAPSHOT'
description = 'Assistente virtual de atendimento da clínica veterinária'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring AI 2.0.0-M4 + OpenAI (ADR-0002, ADR-0016)
    implementation platform('org.springframework.ai:spring-ai-bom:2.0.0-M4')
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    // Fronteiras entre módulos (DA-52): anotações só na compilação; verificação só nos testes
    compileOnly platform('org.springframework.modulith:spring-modulith-bom:2.0.9')
    compileOnly 'org.springframework.modulith:spring-modulith-api'
    testImplementation platform('org.springframework.modulith:spring-modulith-bom:2.0.9')
    testImplementation 'org.springframework.modulith:spring-modulith-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// Testes com IA real (DM-13): só com OPENAI_API_KEY (variável de ambiente ou .env) e dados fictícios.
tasks.register('aiTest', Test) {
    description = 'Testes que chamam a OpenAI de verdade (@Tag("ai")).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ai'
    }
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events = ['passed', 'skipped', 'failed']
        exceptionFormat = 'full'
        showStandardStreams = true
    }
    outputs.upToDateWhen { false }
}

tasks.named('test') {
    useJUnitPlatform {
        // Testes com IA real (Etapa 2+) rodam em task própria (ADR-0006)
        excludeTags 'ai'
    }
    systemProperty 'file.encoding', 'UTF-8'
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
    }
}
