# Configuração em UTF-8 (DM-05). Credenciais nunca aqui: em desenvolvimento,
# o spring-boot-docker-compose lê o compose.yml; fora dele, use variáveis de
# ambiente (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
spring:
  application:
    name: assistant-backend
  config:
    # Desenvolvimento: lê OPENAI_API_KEY (e as variáveis do banco) do .env não versionado.
    # Opcional: fora do desenvolvimento, use variáveis de ambiente de verdade.
    import: optional:file:.env[.properties]
  ai:
    openai:
      # Nunca no código ou no repositório (DM-12). Sem chave, a aplicação sobe, mas toda chamada
      # ao modelo falha com 401 e cai no tratamento de falha (ADR-0002).
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${assistant.ai.model}
          reasoning-effort: low            # ADR-0016 / DA-28
          max-completion-tokens: 2000      # inclui tokens de raciocínio
          # temperature: NÃO definir. O gpt-6-luna pode não aceitar valor diferente do padrão.
    retry:
      # Desliga o retry do Spring AI. Na M4, este valor vira RetryPolicy.maxRetries (novas tentativas,
      # sem contar a primeira): 0 = uma chamada só. Com 1 havia 2 chamadas (SpringAiAssistantModelIT).
      # A única nova tentativa por turno é feita pela aplicação (DA-28).
      max-attempts: 0
    model:
      # Só o chat é usado. Áudio, imagem, embeddings e moderação ficam desligados (DM-03).
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
  http:
    clients:
      # Vale para o RestClient que o Spring AI usa na OpenAI (DA-28). Sem streaming, a API só manda
      # bytes quando termina, então o read-timeout funciona como prazo total da chamada.
      connect-timeout: 5s
      read-timeout: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema versionado pelo Flyway (ADR-0005)
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # timestamps em UTC no banco (DM-06)
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

assistant:
  time-zone: America/Sao_Paulo
  ai:
    model: gpt-6-luna                      # ADR-0016 / DA-28; trocar de modelo é só configuração
  knowledge:
    # Base institucional (ADR-0003). Padrão: o modelo todo null (o assistente não sabe nada da clínica).
    # Desenvolvimento: ASSISTANT_KNOWLEDGE_FILE=file:config/clinic-knowledge.ficticia.yml (dados fictícios).
    location: ${ASSISTANT_KNOWLEDGE_FILE:file:config/clinic-knowledge.example.yml}
  handoff:
    # PROVISÓRIO (P-02): prazo de atendimento humano por nível, valores de desenvolvimento sem decisão da
    # clínica. Passado o prazo sem ação da equipe, a conversa aparece como atrasada e a próxima resposta ao
    # tutor inclui a orientação de contato direto (ADR-0007 item 6, ADR-0018 H11).
    deadlines:
      P1_POSSIBLE_EMERGENCY: 15m
      P2_URGENT: 1h
      P3_CLINICAL_FOLLOW_UP: 4h
      P4_SERVICE_REQUEST: 24h
      P5_ADMINISTRATIVE: 24h
      P6_RELATIONSHIP: 48h
    # PROVISÓRIO (P-10, P-19): textos do sistema. Nenhum afirma notificação nem promete contato (ADR-0007).
    # A orientação de emergência e o contato direto vêm da base (approved-texts, P-01 e P-02); enquanto
    # não aprovados, entram os placeholders abaixo, aceitáveis só com dados fictícios (ADR-0014).
    replies:
      handoff: "Sua conversa ficou registrada para a equipe da clínica."
      waiting-confirmation: "Recebi sua mensagem. Ela ficou registrada nesta conversa para a equipe da clínica."
      human-offer: "Se preferir, sua conversa pode ficar registrada para a equipe da clínica. É só me dizer."
      emergency-placeholder: >-
        [PENDENTE: política de emergência da clínica (P-01)] Se o seu animal estiver em risco, procure
        atendimento veterinário imediatamente.
      short-guidance-placeholder: >-
        [PENDENTE: orientação aprovada pela clínica (P-01)] Se houver piora ou qualquer sinal de risco, procure
        atendimento veterinário imediatamente.
      overdue-placeholder: "[PENDENTE: orientação para quando a equipe não responde no prazo (P-02)]"
  security:
    # X-Api-Key de /api/** (ADR-0012). Só no .env ou em variável de ambiente; sem ela, a aplicação não sobe.
    api-key: ${ASSISTANT_API_KEY:}
  conversation:
    expiration:
      # PROVISÓRIO (P-05): valores de desenvolvimento, sem decisão da clínica. Não usar como definitivos.
      open: 2h
      waiting-human: 24h
    history-max-messages: 20               # ADR-0004 / DA-10 (conta a mensagem atual)
    history-token-budget: 4000             # ADR-0004 / DA-28 (mensagens anteriores, estimativa)
    max-customer-message-length: 2000      # DA-28
    retry-backoff: 1s                      # DA-28: espera antes da única nova tentativa
    # PROVISÓRIO (P-10): texto da resposta segura padrão (ADR-0002), sem dados da clínica.
    fallback-reply: >-
      Desculpe, não consegui responder agora. Você pode enviar sua mensagem de novo daqui a pouco?
      Se for uma situação urgente com o seu animal, procure atendimento veterinário o quanto antes.

logging:
  level:
    root: INFO
    org.springframework.ai: INFO  # nunca DEBUG: logaria prompts com dados pessoais (DM-12)
    org.hibernate.SQL: WARN
