# Configuração em UTF-8 (DM-05). Credenciais nunca aqui: em desenvolvimento,
# o spring-boot-docker-compose lê o compose.yml; fora dele, use variáveis de
# ambiente (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
spring:
  application:
    name: assistant-backend
  config:
    # Desenvolvimento: lê OPENAI_API_KEY (e as variáveis do banco) do .env não versionado.
    # Opcional: fora do desenvolvimento, use variáveis de ambiente de verdade.
    import: optional:file:.env[.properties]
  ai:
    openai:
      # Nunca no código ou no repositório (DM-12). Sem chave, a aplicação sobe, mas toda chamada
      # ao modelo falha com 401 e cai no tratamento de falha (ADR-0002).
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${assistant.ai.model}
          reasoning-effort: low            # ADR-0016 / DA-28
          max-completion-tokens: 2000      # inclui tokens de raciocínio
          # temperature: NÃO definir. O gpt-6-luna pode não aceitar valor diferente do padrão.
    retry:
      # Desliga o retry do Spring AI. Na M4, este valor vira RetryPolicy.maxRetries (novas tentativas,
      # sem contar a primeira): 0 = uma chamada só. Com 1 havia 2 chamadas (SpringAiAssistantModelIT).
      # A única nova tentativa por turno é feita pela aplicação (DA-28).
      max-attempts: 0
    model:
      # Só o chat é usado. Áudio, imagem, embeddings e moderação ficam desligados (DM-03).
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
  http:
    clients:
      # Vale para o RestClient que o Spring AI usa na OpenAI (DA-28). Sem streaming, a API só manda
      # bytes quando termina, então o read-timeout funciona como prazo total da chamada.
      connect-timeout: 5s
      read-timeout: 30s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema versionado pelo Flyway (ADR-0005)
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC          # timestamps em UTC no banco (DM-06)
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

assistant:
  time-zone: America/Sao_Paulo
  ai:
    model: gpt-6-luna                      # ADR-0016 / DA-28; trocar de modelo é só configuração
  knowledge:
    # Carga inicial da clínica fictícia (ADR-0026): importado e publicado só se ela ainda não tem versão publicada.
    # Depois disso a configuração é feita pela web (Configuração) e o arquivo é ignorado. Arquivo inválido não
    # impede a aplicação de subir. Desenvolvimento: ASSISTANT_KNOWLEDGE_FILE=file:config/clinic-knowledge.ficticia.yml.
    location: ${ASSISTANT_KNOWLEDGE_FILE:file:config/clinic-knowledge.example.yml}
    bootstrap-clinic: 00000000-0000-4000-8000-000000000001
  handoff:
    # PROVISÓRIO (P-02): prazo de atendimento humano por nível, valores de desenvolvimento sem decisão da
    # clínica. Passado o prazo sem ação da equipe, a conversa aparece como atrasada e a próxima resposta ao
    # tutor inclui a orientação de contato direto (ADR-0007 item 6, ADR-0018 H11).
    deadlines:
      P1_POSSIBLE_EMERGENCY: 15m
      P2_URGENT: 1h
      P3_CLINICAL_FOLLOW_UP: 4h
      P4_SERVICE_REQUEST: 24h
      P5_ADMINISTRATIVE: 24h
      P6_RELATIONSHIP: 48h
    # PROVISÓRIO (P-10, P-19): textos do sistema. Nenhum afirma notificação nem promete contato (ADR-0007).
    # A orientação de emergência e o contato direto vêm da base (approved-texts, P-01 e P-02); enquanto
    # não aprovados, entram os placeholders abaixo, aceitáveis só com dados fictícios (ADR-0014).
    replies:
      handoff: "Sua conversa ficou registrada para a equipe da clínica."
      # RF-S62 (S5): com o setor que recebeu. {department} = nome do setor. Diz para onde foi; nunca "avisei" (RN-S01).
      handoff-to: "Sua conversa foi encaminhada para a equipe da clínica (setor: {department})."
      waiting-confirmation: "Recebi sua mensagem. Ela ficou registrada nesta conversa para a equipe da clínica."
      human-offer: "Se preferir, sua conversa pode ficar registrada para a equipe da clínica. É só me dizer."
      # PROVISÓRIOS (P-01): sem a marca [PENDENTE] para o tutor desde a DA-40; continuam provisórios até a clínica
      # aprovar a política de emergência (approved-texts.emergency-policy substitui os dois).
      emergency-placeholder: >-
        Se o seu animal estiver em risco, procure atendimento veterinário imediatamente.
      short-guidance-placeholder: >-
        Se houver piora ou qualquer sinal de risco, procure atendimento veterinário imediatamente.
      # Usado só se a base não tiver telefone da recepção nem texto aprovado de contato direto (P-02).
      overdue-placeholder: "Se precisar de ajuda agora, procure a clínica pelo telefone de atendimento."
      # Fail-safe em WAITING_HUMAN quando o modelo falha, com confusão ou insatisfação (CT-19). Sem prometer contato.
      waiting-explanation: >-
        Entendo, e desculpe se não fui claro. Esta conversa está aguardando a equipe da clínica. O que você escrever
        fica registrado junto dela para a equipe.
      waiting-explanation-repeat: >-
        Sua conversa continua aguardando a equipe da clínica. Pode escrever o que precisar: tudo fica registrado
        nela para a equipe.
      # DA-40: pedido registrado para a equipe sem transferir a conversa (o assistente continua ajudando).
      register: "Sua solicitação ficou registrada para a equipe da clínica."
      # DA-40: próximo passo. Nunca promete contato: indica ligar para a recepção (identification.phone), conforme a
      # clínica esteja aberta ({phone}) ou fechada ({when} = próxima abertura, calculada pelo backend).
      next-step-open: "Para falar com a equipe agora, ligue para a recepção: {phone}."
      next-step-closed: "A clínica está fechada agora e abre {when}. A partir desse horário, ligue para a recepção: {phone}."
      next-step-unknown: "Para falar com a equipe, ligue para a recepção no horário de funcionamento: {phone}."
      # Emergência com a clínica fechada (P-01). {referral} = emergency.after-hours-referral da base.
      emergency-closed: "A clínica está fechada agora."
      emergency-referral: "Fora do horário de funcionamento, procure: {referral}"
  customer-data:
    # PROVISÓRIO (P-08): por quanto tempo uma confirmação feita em outra conversa vale como CADASTRADA. Depois,
    # o dado aparece como A_RECONFIRMAR. Valor de desenvolvimento, sem decisão da clínica.
    registered-validity: 365d
    # PROVISÓRIO (P-10): texto do sistema quando a solicitação de agendamento fica registrada (PENDING). Não
    # confirma dia nem horário e não promete contato (DA-07, ADR-0007).
    appointment-registered-reply: >-
      Sua solicitação de agendamento ficou registrada para a equipe da clínica. O dia e o horário só valem depois
      de confirmados pela equipe.
  security:
    # X-Api-Key de /api/** (ADR-0012). Só no .env ou em variável de ambiente; sem ela, a aplicação não sobe.
    api-key: ${ASSISTANT_API_KEY:}
    # Clínica dona da chave (ADR-0021). Padrão: a clínica fictícia criada pela V5.
    api-key-clinic: ${ASSISTANT_API_KEY_CLINIC:00000000-0000-4000-8000-000000000001}
  audio:
    # Etapa S5 (DA-53): áudio do tutor transcrito pela OpenAI (mesma chave do assistente; suboperador na DA-50).
    # Sem chave, o áudio chega à equipe só como anexo. whisper-1 devolve a duração, usada no custo por minuto.
    # DESLIGADO por padrão (revisão pré-piloto, R4): o áudio do tutor só vai à OpenAI depois que o suboperador for
    # aprovado (DA-50, D5). Para ligar: ASSISTANT_AUDIO_ENABLED=true.
    enabled: ${ASSISTANT_AUDIO_ENABLED:false}
    model: whisper-1
  whatsapp:
    # Etapa S4 (ADR-0023). Os três segredos só no .env ou em variável de ambiente, nunca aqui (DM-12). Sem eles a
    # aplicação sobe com o canal desligado: o webhook responde 503 e a tela Configuração > Canal mostra o que falta.
    app-secret: ${WHATSAPP_APP_SECRET:}          # App Secret do app na Meta (assinatura do webhook)
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}      # texto combinado com a Meta ao cadastrar o webhook
    token-key: ${WHATSAPP_TOKEN_KEY:}            # 32 bytes em Base64; cifra o token de acesso guardado no banco
    api-base-url: https://graph.facebook.com
    api-version: v27.0
    max-attempts: 5
    backoff: 10s,30s,2m,10m,30m
    max-text-length: 2000                        # igual a conversation.max-customer-message-length
  alerts:
    # E3 (revisão pré-piloto), achado A10: alerta de trabalho esquecido. PROVISÓRIO até D4 (prazos e escala da
    # clínica): conversa aguardando usa os prazos por nível de handoff.deadlines; escalado = toda a equipe vê.
    scheduling: true                             # varredura a cada sweep-interval (os testes desligam)
    sweep-interval: 1m
    request-unassigned-after: 24h                # solicitação sem responsável (exceto atendimento humano)
  staff:
    # PROVISÓRIO (P-10): enviado ao tutor quando um funcionário assume a conversa (DA-47). Nunca diz "avisei".
    assumed-reply: "{name} ({department}) vai continuar o seu atendimento por aqui."
  conversation:
    expiration:
      # PROVISÓRIO (P-05): valores de desenvolvimento, sem decisão da clínica. Não usar como definitivos.
      open: 2h
      waiting-human: 24h
    history-max-messages: 20               # ADR-0004 / DA-10 (conta a mensagem atual)
    history-token-budget: 4000             # ADR-0004 / DA-28 (mensagens anteriores, estimativa)
    max-customer-message-length: 2000      # DA-28
    retry-backoff: 1s                      # DA-28: espera antes da única nova tentativa
    # PROVISÓRIO (P-10): texto da resposta segura padrão (ADR-0002), sem dados da clínica.
    fallback-reply: >-
      Desculpe, não consegui responder agora. Você pode enviar sua mensagem de novo daqui a pouco?
      Se for uma situação urgente com o seu animal, procure atendimento veterinário o quanto antes.
    # DA-38: apresentação na primeira resposta, garantida pelo backend. PENDENTE (P-10): nome do assistente.
    first-reply-intro: "Sou o assistente virtual da clínica."

logging:
  level:
    root: INFO
    org.springframework.ai: INFO  # nunca DEBUG: logaria prompts com dados pessoais (DM-12)
    org.hibernate.SQL: WARN
